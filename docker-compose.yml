services:
  tradingagents:
    build: .
    env_file:
      - .env
    working_dir: /home/appuser/app
    environment:
      - PYTHONPATH=/home/appuser/app
    volumes:
      - ./output/tradingagents:/home/appuser/.tradingagents
      - ./output/reports:/home/appuser/app/reports
    tty: true
    stdin_open: true

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ./output/ollama:/root/.ollama
    profiles:
      - ollama

  tradingagents-ollama:
    build: .
    env_file:
      - .env
    working_dir: /home/appuser/app
    environment:
      - LLM_PROVIDER=ollama
      - PYTHONPATH=/home/appuser/app
    volumes:
      - ./output/tradingagents:/home/appuser/.tradingagents
      - ./output/reports:/home/appuser/app/reports
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama